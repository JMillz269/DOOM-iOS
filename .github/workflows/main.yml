name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project
        run: |
          xcodebuild -project __MACOSX/code/iphone/Doom.xcodeproj -list

      - name: Build
        run: |
          xcodebuild \
            -project Doom.xcodeproj \
            -scheme Doom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          /usr/bin/zip -r Doom.ipa Payload
      
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Doom.ipa
          path: Doom.ipa
          compression-level: 0
